<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوت‌نامه عروسی | سجاد و زهرا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'B Nazanin','Tahoma','Arial',sans-serif}

body{
  background:#0a0a0a;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.invitation{
  position:relative;
  width:100%;
  height:100%;
  background-image:linear-gradient(135deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.3) 50%, rgba(0,0,0,.4) 100%), url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23d4a574;stop-opacity:0.1"/><stop offset="100%" style="stop-color:%23a0845f;stop-opacity:0.1"/></linearGradient></defs><rect fill="%23121110" width="1200" height="900"/><rect fill="url(%23bg)" width="1200" height="900"/></svg>');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* لایه‌ی ظریف درخشان */
.shine{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);
  animation:shine 8s ease-in-out infinite;
  z-index:1;
}

@keyframes shine{
  0%,70%{transform:translateX(-110%)}
  100%{transform:translateX(110%)}
}

.content{
  position:relative;
  z-index:10;
  text-align:center;
  padding:50px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  backdrop-filter:blur(10px);
  background:linear-gradient(135deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.35) 100%);
  border-radius:25px;
  border:1px solid rgba(212,175,110,.25);
  max-width:650px;
  width:92%;
  box-shadow:0 25px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
}

/* بخش بالا - عنوان */
.header{
  margin-bottom:35px;
}

.title{
  font-size:34px;
  font-weight:bold;
  color:#f4e4c1;
  margin:0 0 12px 0;
  letter-spacing:2px;
  text-shadow:3px 3px 6px rgba(0,0,0,.7);
  font-style:italic;
}

.subtitle{
  font-size:16px;
  color:#d4a574;
  margin:0;
  font-weight:300;
  letter-spacing:0.8px;
  text-shadow:2px 2px 4px rgba(0,0,0,.6);
}

/* نام‌های عروس و داماد */
.names{
  margin:40px 0;
  padding:35px 0;
  border-top:2px solid rgba(212,175,110,.5);
  border-bottom:2px solid rgba(212,175,110,.5);
}

.groom{
  font-size:40px;
  font-weight:bold;
  color:#e8d4b8;
  margin:0 0 18px 0;
  text-shadow:3px 3px 8px rgba(0,0,0,.7);
  letter-spacing:1.5px;
}

.and{
  font-size:22px;
  color:#d4a574;
  margin:0 0 18px 0;
  font-weight:300;
  text-shadow:2px 2px 4px rgba(0,0,0,.6);
}

.bride{
  font-size:40px;
  font-weight:bold;
  color:#f0c4b0;
  margin:0;
  text-shadow:3px 3px 8px rgba(0,0,0,.7);
  letter-spacing:1.5px;
}

/* معلومات تاریخ و زمان */
.details{
  background:rgba(212,175,110,.08);
  border-radius:18px;
  padding:32px 28px;
  margin:32px 0;
  border:1px solid rgba(212,175,110,.35);
  backdrop-filter:blur(12px);
}

.detail-item{
  margin:16px 0;
  font-size:16px;
  color:#e8d4b8;
  line-height:1.9;
}

.detail-label{
  font-weight:bold;
  color:#f4e4c1;
  display:block;
  margin-bottom:6px;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1px;
  text-shadow:1px 1px 3px rgba(0,0,0,.5);
}

.detail-value{
  color:#d4a574;
  font-size:17px;
  text-shadow:1px 1px 3px rgba(0,0,0,.5);
  font-weight:500;
}

/* دکوراسیون */
.decoration{
  font-size:32px;
  margin:25px 0;
  opacity:0.85;
  animation:float 3.5s ease-in-out infinite;
  letter-spacing:3px;
}

@keyframes float{
  0%, 100%{transform:translateY(0px)}
  50%{transform:translateY(-14px)}
}

/* پیام پایانی */
.footer{
  margin-top:35px;
  font-size:15px;
  color:#d4a574;
  line-height:1.9;
  font-style:italic;
  text-shadow:2px 2px 4px rgba(0,0,0,.6);
}

.hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:999px;
  background:rgba(0,0,0,.7);
  color:#d4a574;
  font-size:11px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(212,175,110,.3);
  z-index:20;
  text-shadow:1px 1px 3px rgba(0,0,0,.6);
  letter-spacing:0.5px;
}

/* موبایل */
@media (max-width:768px){
  .content{
    padding:40px 28px;
    width:94%;
    margin:16px;
  }
  
  .title{
    font-size:28px;
    letter-spacing:1.5px;
  }
  
  .groom, .bride{
    font-size:32px;
  }
  
  .and{
    font-size:20px;
  }
  
  .detail-value{
    font-size:16px;
  }
  
  .decoration{
    font-size:28px;
  }
  
  .subtitle{
    font-size:14px;
  }
  
  .names{
    padding:28px 0;
    margin:32px 0;
  }
}

@media (max-width:480px){
  .content{
    padding:30px 20px;
    width:96%;
    border-radius:18px;
  }
  
  .title{
    font-size:24px;
    letter-spacing:1px;
  }
  
  .groom, .bride{
    font-size:26px;
  }
  
  .and{
    font-size:16px;
  }
  
  .detail-value{
    font-size:14px;
  }
  
  .decoration{
    font-size:22px;
    letter-spacing:2px;
  }
  
  .subtitle{
    font-size:12px;
  }
  
  .names{
    padding:20px 0;
    margin:24px 0;
  }
  
  .detail-item{
    margin:12px 0;
    font-size:14px;
  }
}

/* تیم تاریک */
@media (prefers-color-scheme: dark){
  body{
    background:#000;
  }
}

/* انیمیشن ورود */
@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(50px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.content{
  animation:slideUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
</style>
</head>
<body>
  <div class="container">
    <main class="invitation" aria-label="کارت دعوت عروسی سجاد و زهرا">
      <div class="shine"></div>
      
      <div class="content">
        <div class="header">
          <h1 class="title">✨ دعوت‌نامه عروسی ✨</h1>
          <p class="subtitle">ما افتخار دعوت شما را به جشن ازدواج داریم</p>
        </div>
        
        <div class="decoration">💐 🌹 💍 🌹 💐</div>
        
        <div class="names">
          <div class="groom">محمد سجاد</div>
          <div class="and">&</div>
          <div class="bride">زهرا</div>
        </div>
        
        <div class="details">
          <div class="detail-item">
            <span class="detail-label">📅 تاریخ</span>
            <span class="detail-value">یکشنبه، ۱۴۰۵/۰۷/۰۲</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">⏰ ساعت شروع</span>
            <span class="detail-value">۷:۳۰ شب تا پاسی شب</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">🍇 برنامه مراسم</span>
            <span class="detail-value">به صرف میوه، شیرینی و شام</span>
          </div>
        </div>
        
        <div class="decoration">💐 🌹 💍 🌹 💐</div>
        
        <div class="footer">
          <p>❤️ حضور و دعای شما برای ما بسیار گرامی است ❤️</p>
        </div>
      </div>
      
      <div class="hint">سجاد و زهرا · ۱۴۰۵/۰۷/۰۲</div>
    </main>
  </div>
</body>
</html>
