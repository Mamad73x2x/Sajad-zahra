<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوت‌نامه عروسی | سجاد و ...</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#1d1a16;
  font-family:Tahoma,Arial,sans-serif;
}
.invitation{
  position:relative;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  background-image:url("background.png");
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
  background-color:#ead9b8;
}
/* پس‌زمینه روی موبایل هم کامل دیده می‌شود */
@media (max-width:600px){
  .invitation{
    background-size:100% auto;
    background-position:center center;
  }
}
/* لایه‌ی بسیار ظریف برای حس زنده بودن صفحه */
.shine{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);
  animation:shine 7s ease-in-out infinite;
}
@keyframes shine{
  0%,65%{transform:translateX(-110%)}
  100%{transform:translateX(110%)}
}
.hint{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  padding:7px 14px;
  border-radius:999px;
  background:rgba(35,25,15,.55);
  color:#fff8e9;
  font-size:11px;
  backdrop-filter:blur(5px);
  opacity:.75;
}
</style>
</head>
<body>
  <main class="invitation" aria-label="کارت دعوت عروسی سجاد و ...">
    <div class="shine"></div>
    <div class="hint">سجاد و ... · ۱۴۰۵/۰۷/۰۲ · ۱۸:۰۰</div>
  </main>
</body>
</html>
