<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوت‌نامه عروسی | محمد سجاد و زهرا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'B Nazanin','Tahoma','Arial',sans-serif}

body{
  background:#000;
}

.page{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* عکس پس‌زمینه */
.bg-image{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image:url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1200&h=900&fit=crop');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  z-index:0;
}

/* لایه‌ی تاریکی برای خوانایی */
.overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.35) 100%);
  z-index:1;
}

/* لایه‌ی درخشان */
.shine{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%);
  animation:shine 8s ease-in-out infinite;
  z-index:2;
}

@keyframes shine{
  0%,70%{transform:translateX(-110%)}
  100%{transform:translateX(110%)}
}

.content{
  position:relative;
  z-index:10;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100%;
  width:100%;
  padding:40px 30px;
}

/* عنوان */
.header{
  margin-bottom:60px;
  animation:slideDown 1s ease-out;
}

.title{
  font-size:36px;
  font-weight:bold;
  color:#f4e4c1;
  margin:0 0 12px 0;
  letter-spacing:2px;
  text-shadow:3px 3px 8px rgba(0,0,0,.8);
}

.subtitle{
  font-size:16px;
  color:#d4a574;
  margin:0;
  font-weight:300;
  letter-spacing:0.8px;
  text-shadow:2px 2px 5px rgba(0,0,0,.7);
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* نام‌های بزرگ */
.names{
  display:flex;
  flex-direction:column;
  gap:15px;
  align-items:center;
  margin:60px 0;
}

.groom{
  font-size:56px;
  font-weight:bold;
  color:#e8d4b8;
  margin:0;
  text-shadow:3px 3px 10px rgba(0,0,0,.8);
  letter-spacing:2px;
  animation:fadeInLeft 1s ease-out;
}

.and{
  font-size:24px;
  color:#d4a574;
  margin:0;
  font-weight:300;
  text-shadow:2px 2px 6px rgba(0,0,0,.7);
  animation:fadeIn 1s ease-out 0.3s both;
}

.bride{
  font-size:56px;
  font-weight:bold;
  color:#f0c4b0;
  margin:0;
  text-shadow:3px 3px 10px rgba(0,0,0,.8);
  letter-spacing:2px;
  animation:fadeInRight 1s ease-out 0.6s both;
}

@keyframes fadeInLeft{
  from{
    opacity:0;
    transform:translateX(-50px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes fadeInRight{
  from{
    opacity:0;
    transform:translateX(50px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* اطلاعات */
.details{
  background:rgba(0,0,0,.5);
  border-radius:20px;
  padding:32px 40px;
  border:2px solid rgba(212,175,110,.4);
  backdrop-filter:blur(10px);
  margin:40px 0;
  max-width:600px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.detail-row{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:30px;
}

.detail-item{
  flex:1;
  min-width:140px;
}

.detail-label{
  font-weight:bold;
  color:#f4e4c1;
  display:block;
  margin-bottom:8px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  text-shadow:1px 1px 3px rgba(0,0,0,.6);
}

.detail-value{
  color:#d4a574;
  font-size:16px;
  font-weight:500;
  text-shadow:1px 1px 3px rgba(0,0,0,.5);
}

/* دکوراسیون */
.decoration{
  font-size:32px;
  margin:0;
  opacity:0.8;
  animation:float 3.5s ease-in-out infinite;
  letter-spacing:4px;
}

@keyframes float{
  0%, 100%{transform:translateY(0px)}
  50%{transform:translateY(-12px)}
}

/* پیام انتهایی */
.footer-msg{
  font-size:15px;
  color:#d4a574;
  margin:30px 0 0 0;
  font-style:italic;
  line-height:1.8;
  text-shadow:2px 2px 5px rgba(0,0,0,.7);
}

/* موبایل */
@media (max-width:768px){
  .groom, .bride{
    font-size:40px;
  }
  
  .and{
    font-size:18px;
  }
  
  .title{
    font-size:28px;
  }
  
  .details{
    padding:24px 28px;
    margin:30px 0;
  }
  
  .detail-row{
    flex-direction:column;
    gap:16px;
  }
  
  .detail-value{
    font-size:15px;
  }
  
  .content{
    padding:30px 20px;
  }
  
  .header{
    margin-bottom:40px;
  }
  
  .names{
    margin:40px 0;
  }
}

@media (max-width:480px){
  .groom, .bride{
    font-size:32px;
  }
  
  .and{
    font-size:16px;
  }
  
  .title{
    font-size:24px;
  }
  
  .subtitle{
    font-size:13px;
  }
  
  .details{
    padding:20px 20px;
    margin:24px 10px;
  }
  
  .detail-label{
    font-size:10px;
  }
  
  .detail-value{
    font-size:14px;
  }
  
  .decoration{
    font-size:24px;
    letter-spacing:2px;
  }
  
  .footer-msg{
    font-size:13px;
  }
  
  .content{
    padding:20px 15px;
    justify-content:space-around;
  }
  
  .header{
    margin-bottom:20px;
  }
  
  .names{
    margin:20px 0;
    gap:8px;
  }
}

.hint{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 16px;
  border-radius:999px;
  background:rgba(0,0,0,.7);
  color:#d4a574;
  font-size:10px;
  backdrop-filter:blur(8px);
  border:1px solid rgba(212,175,110,.3);
  z-index:20;
  text-shadow:1px 1px 2px rgba(0,0,0,.6);
  letter-spacing:0.5px;
}
</style>
</head>
<body>
  <div class="page">
    <div class="bg-image"></div>
    <div class="overlay"></div>
    <div class="shine"></div>
    
    <div class="content">
      <!-- عنوان -->
      <div class="header">
        <h1 class="title">✨ دعوت‌نامه عروسی ✨</h1>
        <p class="subtitle">افتخار دعوت شما را داریم</p>
      </div>
      
      <!-- نام‌ها -->
      <div class="names">
        <div class="groom">محمد سجاد</div>
        <div class="and">&</div>
        <div class="bride">زهرا</div>
      </div>
      
      <div class="decoration">💐 🌹 💍 🌹 💐</div>
      
      <!-- اطلاعات -->
      <div class="details">
        <div class="detail-row">
          <div class="detail-item">
            <span class="detail-label">📅 تاریخ</span>
            <span class="detail-value">یکشنبه ۱۴۰۵/۰۷/۰۲</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">⏰ ساعت</span>
            <span class="detail-value">۷:۳۰ شب تا پاسی شب</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">🍇 برنامه</span>
            <span class="detail-value">میوه، شیرینی و شام</span>
          </div>
        </div>
      </div>
      
      <p class="footer-msg">❤️ حضور و دعای شما برای ما بسیار گرامی است ❤️</p>
    </div>
    
    <div class="hint">سجاد و زهرا · ۱۴۰۵/۰۷/۰۲</div>
  </div>
</body>
</html>
