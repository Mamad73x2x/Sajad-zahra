<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوت‌نامه عروسی | محمد سجاد و زهرا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'B Nazanin','Tahoma','Arial',sans-serif}

body{
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.container{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.image-frame{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
}

.image-frame img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* موبایل */
@media (max-width:768px){
  .image-frame img{
    object-fit:cover;
  }
}
</style>
</head>
<body>
  <div class="container">
    <div class="image-frame">
      <img src="https://raw.githubusercontent.com/Mamad73x2x/Sajad-zahra/main/file_00000000ca7c822fa60005dc757bcab8.png" alt="دعوت‌نامه عروسی">
    </div>
  </div>
</body>
</html>
